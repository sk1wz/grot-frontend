<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8ddd5" />
    <title>InfoFusion offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f8f7;
        color: #20232a;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(420px, calc(100% - 32px));
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #5f6670;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="InfoFusion" />
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и обновите страницу.</p>
    </main>
  </body>
</html>
